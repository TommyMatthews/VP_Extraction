LOG_OUTPUT = /home/users/tommy/VP_extraction_top/outputs/Luton_Airport_Output.txt


[CVP_SETTINGS]
column_type = cartesian
PROFILE_TYPE = CVP
MET_OFFICE = True
# define which CVPs we want to create
COL_RADIUS = 2.5
MAX_RADIUS = 30.0
MIN_H = 0
MAX_H = 2000
H_STEP = 200

[CVP_parameters]
x_size = 5000
y_size = 5000

[CVP_LOCATIONS]
CREATE_CVP_GRID = False

[SPECIFIC_CVPS]
# lat lon of fixed sites
SPECIFIC_CVP = 51.877481 -0.370854 fixed1 

[FIELD_LIST]
f1 = equivalent_reflectivity_factor
f2 = velocity
f3 = normalized_coherent_power
f4 = spectrum_width
f5 = differential_reflectivity
f6 = cross_correlation_ratio
f7 = differential_phase

[logarithmic_fields_list]
f1 = reflectivity